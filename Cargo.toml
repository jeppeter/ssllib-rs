[package]
name = "ssllib"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
lazy_static = "^1.4.0"
chrono = "^0.4.0"
bytes = "^0.5.3"
regex = "1"
digest = {version = "^0.10.7",features=["oid"]}
sha2 = {version = "^0.10.2", features=["oid"]}
sha1 = {version= "^0.10.6",features=["oid"]}
md-5 = { version = "^0.10", features=["oid"]}
serde_json = "^1.0.42"
serde = { version = "^1.0", features = ["derive"] }
rsa = "^0.9.8"
rand_core = "^0.6.4"
rand = "^0.8.5"
hmac = "^0.12.1"
aes = "0.8.1"
rust-crypto = "^0.2.36"
cbc = "0.1.2"
base64 = "^0.13.0"
#asn1obj = { path = "../asn1obj/asn1obj"}
asn1obj = "^0.2.0"
#asn1obj_codegen = { path = "../asn1obj/asn1obj_codegen"}
asn1obj_codegen = "^0.2.0"
#ecsimple = {path = "../ecsimple" , features=["debug_mode"]}
ecsimple = {version = "^0.1.10", features=["debug_mode"]}
cipher = "^0.4.0"
zeroize = "^1.8.1"
num-traits = "^0.2"
num-bigint-dig = "^0.8.1"
num-bigint = "^0.4.3"


