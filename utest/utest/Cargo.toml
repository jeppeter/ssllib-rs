[package]
name = "utest"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ssllib = {path = "../../"}
extargsparse_worker = "^0.2.0"
extargsparse_codegen = "^0.1.4"
lazy_static = "^1.4.0"
regex = "1"
chrono = "^0.4.0"
serde_json = "^1.0.42"
#serde = { version = "^1.0", features = ["derive"] }
log4rs = "^0.8.3"
log = "^0.4.8"
base64 = "^0.13.0"
#asn1obj = { path = "../../../asn1obj/asn1obj"}
asn1obj = "^0.1.22"
#asn1obj_codegen = { path = "../../../asn1obj/asn1obj_codegen"}
asn1obj_codegen = "^0.1.8"
k256="^0.11.6"
p384="^0.11.2"
hex="^0.4.3"
rand_core="^0.6.3"
rust-ini = "^0.18.0"
pe-parser = "^0.6.0"
reqwest = {version = "^0.12.14", features = ["json", "multipart", "blocking", "cookies"]}


[target.'cfg(windows)'.dependencies.winapi]
version = "0.3"
features = ["winbase", "debugapi", "stringapiset", "winnls", "datetimeapi",
	"sysinfoapi", "wincred","combaseapi","errhandlingapi"]
